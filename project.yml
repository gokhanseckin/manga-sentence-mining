name: MangaMining
options:
  bundleIdPrefix: com.gokhanseckin
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.20.0
targets:
  MangaMining:
    type: application
    platform: iOS
    sources:
      - path: MangaMining
    resources:
      - path: MangaMining/Resources
        optional: true
    info:
      path: MangaMining/Info.plist
      properties:
        CFBundleDisplayName: Manga Mining
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Manga Mining needs camera access to capture printed manga pages and OCR the text.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gokhanseckin.mangamining
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: onnxruntime
        product: onnxruntime
