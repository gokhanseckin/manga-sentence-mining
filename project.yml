name: JapaneseSentenceMining
options:
  bundleIdPrefix: com.gokhanseckin
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  Mecab-Swift:
    url: https://github.com/shinjukunian/Mecab-Swift
    revision: 1f096492e37fc05fc2e7304091f54889974c5368
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.12.1"
targets:
  JapaneseSentenceMining:
    type: application
    platform: iOS
    sources:
      - path: JapaneseSentenceMining
    dependencies:
      - package: Mecab-Swift
        product: Mecab-Swift
      - package: Mecab-Swift
        product: IPADic
      - package: Sentry
        product: Sentry
    postBuildScripts:
      - name: Upload dSYMs to Sentry
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then
            echo "Skipping Sentry dSYM upload for ${CONFIGURATION} build."
            exit 0
          fi
          if ! command -v sentry-cli >/dev/null 2>&1; then
            echo "warning: sentry-cli not installed; skipping dSYM upload."
            exit 0
          fi
          # Auth resolution order: SENTRY_AUTH_TOKEN env, .sentryclirc.local, ~/.sentryclirc.
          if ERROR=$(sentry-cli debug-files upload --include-sources "${DWARF_DSYM_FOLDER_PATH}" 2>&1); then
            echo "${ERROR}"
          else
            echo "warning: sentry-cli dSYM upload failed (continuing build): ${ERROR}"
          fi
    entitlements:
      path: JapaneseSentenceMining/JapaneseSentenceMining.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.gokhanseckin.universalsentencemining
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: JapaneseSentenceMining/Info.plist
      properties:
        CFBundleDisplayName: Japanese Sentence Mining
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        NSCameraUsageDescription: Japanese Sentence Mining needs camera access to capture printed Japanese pages and OCR the text.
        NSPhotoLibraryAddUsageDescription: Japanese Sentence Mining can save captured pages to your Photos library when the camera-roll setting is on.
        NSPhotoLibraryUsageDescription: Japanese Sentence Mining lets you pick existing photos from your Photos library to OCR.
        SentryDSN: $(SENTRY_DSN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gokhanseckin.universalsentencemining
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        # Sentry DSN — safe to commit (public client identifier per Sentry docs).
        SENTRY_DSN: https://9d4a5e6079344002725ccd389d5bf826@o4511366425018368.ingest.de.sentry.io/4511366454116432
